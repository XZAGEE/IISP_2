
name: Audio ML CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install pytest httpx

      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: |
          docker build \
            --build-arg DATASET_DIR=ci_dataset \
            --build-arg EPOCHS=30 \
            --build-arg SEED=42 \
            -t iisp-audio-api:${{ github.sha }} .

      - name: Run container
        run: |
          docker run -d \
            --name audio-api \
            -p 8000:8000 \
            iisp-audio-api:${{ github.sha }}

      - name: Wait for health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs audio-api
          exit 1

      - name: Smoke test model info
        run: |
          curl -fsS http://localhost:8000/model-info

      - name: Check accuracy threshold
        run: |
          python -c "import json, urllib.request; d=json.load(urllib.request.urlopen('http://localhost:8000/model-info')); print('Accuracy:', d['accuracy'], '%'); assert d['accuracy'] >= 80, 'Accuracy below 80%'"

      - name: Smoke test prediction
        run: |
          curl -fsS \
            -F "file=@samples/test_yes.wav" \
            http://localhost:8000/predict

      - name: Show container logs on failure
        if: failure()
        run: docker logs audio-api

      - name: Stop container
        if: always()
        run: docker rm -f audio-api || true
